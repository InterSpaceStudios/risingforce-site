<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RisingForce</title>
<meta name="description" content="RisingForce: sites and games, built from scratch. Match Tracker and The Killer Game.">
<meta property="og:title" content="RisingForce">
<meta property="og:description" content="Sites and games, built from scratch.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://risingforce.se/">
<meta property="og:image" content="https://risingforce.se/media/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8792b'/%3E%3Cpath d='M6 22 16 8l10 14h-6l-4-6-4 6z' fill='%230c0c0d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=Geist:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Lilita+One&family=Nunito:wght@800&family=Chakra+Petch:wght@600&family=Rajdhani:wght@700&family=Unbounded:wght@500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0c0d; --ink: #ece8df; --dim: #8b8880; --line: rgba(236, 232, 223, .2); --dev: #e8792b;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    --gut: clamp(16px, 4vw, 56px); --bar: 42px; }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); scroll-snap-type: y mandatory; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { color: var(--ink); font: 400 17px/1.5 var(--body); }
  a { color: inherit; }
  img { display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  /* every small label on the page: one face, set by --label (see LABELS in the script) */
  .mono { font: var(--lw, 600) calc(11px * var(--lk, 1))/1.5 var(--label, "Chakra Petch"), var(--mono); text-transform: uppercase; letter-spacing: var(--ls, .06em); }
  .mono b { font-weight: inherit !important; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  :focus-visible { outline: 2px solid var(--dev); outline-offset: 2px; }

  .bar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; height: var(--bar); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--gut); background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar a { text-decoration: none; }
  .bar .name { font: 700 20px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; }
  .bar nav, .bar .tog { display: flex; gap: 18px; color: var(--dim); }
  .bar nav a:hover, .bar .tog button:hover { color: var(--dev); }
  .bar .tog button { text-transform: inherit; letter-spacing: inherit; }
  .bar .tog b { color: var(--ink); font-weight: 400; }

  /* One screen per stop. The page scrolls, but each stop's content is the face of a gate: it sits at the
     gate's parked outline (--l/--t/--w/--h) and the script scales and lifts it with the gate, so a gate
     looks the same on the move as it does parked. */
  main { position: relative; z-index: 1; }
  .stop { height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }
  .face { position: fixed; left: var(--l, 0); top: var(--t, 0); width: var(--w, 0); height: var(--h, 0); container-type: inline-size; display: none; background: var(--gate, #121314); transform-origin: 50% 50%; will-change: transform; overflow: hidden; }
  .face.vis { display: block; }
  .in { position: absolute; inset: 0 0 9.6% 0; background: var(--gate, #121314); padding: 6cqw 7.5cqw 3cqw; display: flex; flex-direction: column; overflow: hidden; }
  .strip { position: absolute; left: 0; right: 0; bottom: 1.8%; height: 6%; background: repeating-linear-gradient(-45deg, var(--sa) 0 3.06cqw, var(--sb) 3.06cqw 6.12cqw); }
  .fog { position: absolute; inset: 0; background: rgb(9, 9, 10); opacity: var(--fog, 0); pointer-events: none; }
  .top { display: flex; justify-content: space-between; color: var(--dim); font-size: calc(clamp(9px, 2.5cqw, 13px) * var(--lk, 1)); }
  .top b { color: var(--dev); font-weight: 500; }
  .sm { font-size: calc(clamp(9px, 2.5cqw, 13px) * var(--lk, 1)); }
  .btns { display: flex; flex-wrap: wrap; gap: 2.4cqw; margin-top: auto; }
  .go { display: inline-block; padding: 2.4cqw 4.6cqw 2.7cqw; background: var(--dev); color: #0c0c0d; font: 700 4.4cqw/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; }
  .go:hover { background: var(--ink); }

  /* gate 0: the name, and what is behind it */
  .t-hero .top { font-size: calc(clamp(10px, 3.1cqw, 18px) * var(--lk, 1)); color: var(--ink); }
  .t-hero h1 { font: 700 31cqw/.8 var(--cond); text-transform: uppercase; margin: 5cqw 0 0 -.03em; }
  .t-hero h1 span { display: block; }
  .t-hero h1 span + span { color: var(--dev); }
  .t-hero .tag { font: 500 5.4cqw/1.12 var(--cond); text-transform: uppercase; letter-spacing: .02em; margin-top: 4cqw; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; margin-top: auto; }
  .chip { text-decoration: none; }
  .chip img { width: 100%; aspect-ratio: 1.6; object-fit: cover; object-position: 50% 0; box-shadow: 0 0 0 1px var(--line); }
  .chip.k img { object-position: 50% 36%; }
  .chip span { display: flex; justify-content: space-between; margin-top: 1.6cqw; font-size: clamp(9px, 2.4cqw, 13px); }
  .chip span b { color: var(--dev); font-weight: 500; }
  .chip:hover img { box-shadow: 0 0 0 2px var(--dev); }
  .next { color: var(--dim); margin-top: 3.5cqw; }

  /* Match Tracker: its own look (near black, Geist, orange only for what is live) */
  .t-tracker { --live: #ff5a2b; font-family: "Geist", var(--body); }
  .t-tracker .top b { color: var(--live); }
  .shots { position: relative; display: block; margin-top: 3cqw; }
  .shots .desk { width: 100%; aspect-ratio: 1.85; object-fit: cover; object-position: 50% 0; box-shadow: 0 0 0 1px rgba(255, 255, 255, .16); }
  .shots .phone { position: absolute; right: 3.5cqw; top: 8cqw; width: 19cqw; aspect-ratio: .5; object-fit: cover; object-position: 50% 0; border: .7cqw solid #0a0a0a; box-shadow: 0 0 0 1px rgba(255, 255, 255, .3); border-radius: 2.2cqw; }
  .shots:hover .desk { box-shadow: 0 0 0 2px var(--live); }
  .livebox { margin-top: 3.2cqw; min-height: 15cqw; width: 72%; }
  .livebox .st { display: flex; align-items: center; gap: 1.4cqw; color: var(--dim); white-space: nowrap; }
  .livebox .st b { color: var(--live); font-weight: 500; }
  .livebox .dot { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: var(--live); flex: none; }
  .match { display: flex; align-items: center; gap: 2cqw; margin-top: 1.4cqw; font: 600 5.6cqw/1.05 "Geist", var(--body); letter-spacing: -.02em; white-space: nowrap; }
  .match img { width: 5.4cqw; height: 5.4cqw; object-fit: contain; flex: none; }
  .match .f { color: var(--live); }
  .match .o { color: #a1a1a1; overflow: hidden; text-overflow: ellipsis; }
  .match .sc { font-variant-numeric: tabular-nums; }
  .t-tracker h2 { font: 600 9cqw/1 "Geist", var(--body); letter-spacing: -.04em; margin-top: auto; }
  .t-tracker .blurb { color: #a1a1a1; font-size: clamp(12px, 3.5cqw, 21px); line-height: 1.4; margin: 1.6cqw 0 3.4cqw; }
  .t-tracker .btns { margin-top: 0; }
  .t-tracker .go { background: #ededed; color: #0a0a0a; font: 600 3.4cqw/1 "Geist", var(--body); letter-spacing: 0; text-transform: none; border-radius: 99cqw; padding: 2.6cqw 4.6cqw; }
  .t-tracker .go:hover { background: var(--live); }

  /* The Killer Game: its own look (purple, yellow, chunky) */
  .t-killer { --p: #6c2bd9; --y: #ffd23f; --edge: #3b138f; font-family: "Nunito", var(--body); font-weight: 800;
    background-image: radial-gradient(rgba(255, 255, 255, .13) 1.1cqw, transparent 1.2cqw); background-size: 6.2cqw 6.2cqw; background-color: var(--gate, #6c2bd9); }
  .t-killer .top { color: rgba(255, 255, 255, .75); }
  .t-killer .top b { color: var(--y); }
  .phones { display: flex; justify-content: center; align-items: center; gap: 2.4cqw; margin-top: 5cqw; }
  .ph { width: 23cqw; aspect-ratio: .5; object-fit: cover; border-radius: 3.4cqw; box-shadow: 0 1.1cqw 0 var(--edge); }
  .ph.a { transform: rotate(-5deg); }
  .ph.b { transform: rotate(3deg) translateY(-1.5cqw); }
  .deal { width: 31cqw; aspect-ratio: .62; border-radius: 3.4cqw; box-shadow: 0 1.1cqw 0 var(--edge), 0 0 0 .7cqw var(--y); background: var(--p); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqw; padding: 2cqw; transform: rotate(4deg); font-family: "Lilita One", var(--cond); font-weight: 400; }
  .deal .bubble { width: 100%; background: #fff; border-radius: 3cqw; box-shadow: 0 .8cqw 0 var(--edge); padding: 3.4cqw 1cqw 3cqw; text-align: center; }
  .deal .pill { display: inline-block; padding: .7cqw 1.8cqw .9cqw; border-radius: 9cqw; color: #fff; font-size: 2.5cqw; letter-spacing: .02em; transform: rotate(-3deg); background: #1db95f; white-space: nowrap; }
  .deal .pill.killer { background: #ff3b5c; }
  .deal .w { display: block; color: var(--edge); font-size: 6cqw; line-height: 1.1; margin-top: 1.6cqw; }
  .deal .wl { display: block; color: #8a6ad6; font: 800 2cqw/1 "Nunito", sans-serif; margin-top: .8cqw; }
  .deal .tap { background: var(--y); color: var(--edge); border-radius: 9cqw; box-shadow: 0 .7cqw 0 var(--edge); padding: 1.3cqw 3.4cqw 1.5cqw; font-size: 3.2cqw; }
  .deal:hover .tap { background: #fff; }
  .deal.pop .bubble { animation: pop .16s ease-out; }
  @keyframes pop { from { transform: scale(.86); } to { transform: none; } }
  .klogo { font: 400 21cqw/.9 "Lilita One", var(--cond); color: var(--y); text-shadow: 0 1.1cqw 0 var(--edge); transform: rotate(-3deg); transform-origin: 0 100%; margin-top: auto; }
  .t-killer .blurb { color: #fff; font-size: clamp(12px, 3.5cqw, 21px); line-height: 1.35; margin: 2.6cqw 0 3.6cqw; }
  .t-killer .btns { margin-top: 0; }
  .kbtn { display: inline-block; padding: 2.2cqw 5.4cqw 2.5cqw; border-radius: 4cqw; background: var(--y); color: var(--edge); box-shadow: 0 1cqw 0 var(--edge); font: 400 4.6cqw/1 "Lilita One", var(--cond); text-decoration: none; }
  .kbtn.w { background: #fff; color: var(--p); }
  .kbtn:hover { transform: translateY(.4cqw); box-shadow: 0 .6cqw 0 var(--edge); }

  /* any other project: plain */
  .t-plain h2, .t-contact h2 { font: 700 16.5cqw/.86 var(--cond); text-transform: uppercase; margin-top: auto; overflow-wrap: anywhere; }
  .t-plain .blurb { font-size: clamp(14px, 4.4cqw, 26px); line-height: 1.4; margin: 3.5cqw 0 5cqw; }
  .t-plain .btns { margin-top: 0; }

  /* last gate: contact as big tiles */
  .t-contact h2 { margin-top: 3.5cqw; }
  .tiles { display: grid; gap: 2.4cqw; margin: 5cqw 0 3cqw; }
  .tile { display: flex; align-items: center; gap: 4.5cqw; padding: 3.6cqw 4cqw; box-shadow: inset 0 0 0 1px var(--line); text-decoration: none; text-align: left; }
  .tile svg { width: 12cqw; height: 12cqw; flex: none; }
  .tile .v { font: 700 10cqw/1 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
  .tile .a { margin-left: auto; color: var(--dim); }
  .tile:hover { box-shadow: inset 0 0 0 2px var(--dev); }
  .tile:hover .a { color: var(--dev); }
  .fine { margin-top: auto; color: var(--dim); font-size: clamp(8px, 2.1cqw, 11px); }
  .fine a:hover { color: var(--dev); }

  #radar { position: fixed; z-index: 4; right: var(--gut); bottom: 18px; width: 300px; background: var(--bg); border: 1px solid var(--line); padding: 8px 10px 10px; }
  #radar .where { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  #radar .where b { color: var(--ink); font-weight: 400; }
  #radar svg { display: block; width: 100%; height: auto; color: var(--ink); }
  #radar .hit { fill: transparent; cursor: pointer; }
  #radar .hit:hover { fill: rgba(232, 121, 43, .4); }

  /* no WebGL2: the same faces as a plain page */
  body.no3d #gl, body.no3d #radar { display: none; }
  html:has(body.no3d) { scroll-snap-type: none; }
  body.no3d .stop { height: auto; padding: calc(var(--bar) + 24px) var(--gut) 24px; }
  body.no3d .face { display: block; position: relative; left: auto; top: auto; width: min(560px, 100%); height: auto; aspect-ratio: .74; margin: 0 auto; }
  body.no3d .fog { display: none; }
  body.no3d .in { inset: 0; }
  #fontpick { position: fixed; z-index: 4; left: var(--gut); bottom: 18px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--line); color: var(--dim); font: 12px/1.4 system-ui, sans-serif; }
  @media (max-width: 860px) { .bar nav, #radar, #fontpick { display: none; } }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<header class="bar mono">
  <a class="name" href="#top">RisingForce</a>
  <nav><a href="#projects" id="n-proj">Projects</a><a href="#contact">Contact</a></nav>
  <div class="tog">
    <button id="b-snd" type="button" aria-pressed="false">Sound <b>off</b></button>
    <button id="b-mot" type="button">Motion <b>full</b></button>
  </div>
</header>

<main id="stops"></main>

<div id="radar">
  <div class="where mono"><b id="r-where">Entrance</b><span id="r-n"></span></div>
  <svg id="r-svg" role="img" aria-label="Map of the page: click a gate to jump there"></svg>
</div>

<div id="fontpick"></div>

<script src="shared/content.js"></script>
<script>
(() => {
"use strict";
const RF = window.RF;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

// Motion: "full" glides between gates; "calm" cuts. The default follows the visitor's reduced-motion
// setting; the toggle (or ?motion=full / ?motion=calm) overrides and is remembered.
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
const mq = /[?&]motion=(full|calm)/.exec(location.search);
if (mq) store.set("rf-motion", mq[1]);
let calm = (store.get("rf-motion") || (matchMedia("(prefers-reduced-motion: reduce)").matches ? "calm" : "full")) === "calm";

// TEMPORARY: label font chooser, only on the local preview. Press F to step through, or open with
// ?font=3. Once one is picked, keep that row as the default and delete the rest, the key handler and
// #fontpick. The published site always uses the first row.
const LABELS = [["Chakra Petch", 600, 1.06, ".06em"], ["Rajdhani", 700, 1.18, ".08em"], ["Barlow Condensed", 600, 1.24, ".08em"], ["Unbounded", 500, 0.86, ".04em"], ["Silkscreen", 400, 0.96, ".02em"]];
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let labelAt = LOCAL ? clamp(+((/[?&]font=(\d)/.exec(location.search) || [])[1] || store.get("rf-font") || 1), 1, LABELS.length) - 1 : 0;
function setLabel() {
  const [fam, w, k, ls] = LABELS[labelAt], r = document.documentElement.style;
  r.setProperty("--label", `"${fam}"`); r.setProperty("--lw", w); r.setProperty("--lk", k); r.setProperty("--ls", ls);
  if (!LOCAL) return;
  $("#fontpick").textContent = `Label font ${labelAt + 1}/${LABELS.length}: ${fam}. Press F for the next one.`;
  store.set("rf-font", labelAt + 1);
}
if (LOCAL) addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "f" && !e.ctrlKey && !e.metaKey && !e.altKey) { labelAt = (labelAt + 1) % LABELS.length; setLabel(); } });
else $("#fontpick").remove();
setLabel();

/* ---------- the page: one stop per gate. Gate 0 is the front door, the last one is contact. ---------- */
const N = RF.projects.length, NS = N + 2;
const top = (a, b) => `<div class="top mono"><span>${a}</span><b>${b}</b></div>`;
const faceOf = {
  tracker: (p, i) => `<div class="in t-tracker">
    ${top(`${pad(i + 1)} / ${pad(N)}`, esc(p.status))}
    <a class="shots" href="${esc(p.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(p.title)}">
      <img class="desk" src="${esc(p.shots.desk)}" alt="${esc(p.title)} on a desktop: a live scoreboard and the day's schedule">
      <img class="phone" src="${esc(p.shots.phone)}" alt="${esc(p.title)} on a phone">
    </a>
    <div class="livebox" id="livebox" data-api="${esc(p.api)}"></div>
    <h2>${esc(p.title)}</h2>
    <p class="blurb">${esc(p.blurb)}</p>
    <div class="btns"><a class="go" href="${esc(p.url)}" target="_blank" rel="noopener">Open the tracker &nearr;</a></div>
  </div>`,
  killer: (p, i) => `<div class="in t-killer">
    ${top(`${pad(i + 1)} / ${pad(N)}`, esc(p.status))}
    <div class="phones">
      <img class="ph a" src="${esc(p.shots.home)}" alt="${esc(p.title)}: the home screen">
      <img class="ph b" src="${esc(p.shots.hold)}" alt="${esc(p.title)}: hold to reveal your role">
      <button class="deal" id="deal" type="button" aria-label="Deal a new role">
        <span class="bubble"><span class="pill" id="d-role"></span><span class="w" id="d-word"></span><span class="wl">YOUR WORD</span></span>
        <span class="tap">DEAL AGAIN</span>
      </button>
    </div>
    <h2 class="klogo">KILLER!</h2>
    <p class="blurb">${esc(p.blurb)}</p>
    <div class="btns"><a class="kbtn" href="${esc(p.url)}" target="_blank" rel="noopener">PLAY IT</a>${p.repo ? `<a class="kbtn w" href="${esc(p.repo)}" target="_blank" rel="noopener">GITHUB</a>` : ""}</div>
  </div>`,
  plain: (p, i) => `<div class="in t-plain">
    ${top(`${pad(i + 1)} / ${pad(N)}`, esc(p.status))}
    <h2>${esc(p.title)}</h2>
    <p class="blurb">${esc(p.blurb)}</p>
    <div class="btns">${p.url ? `<a class="go" href="${esc(p.url)}" target="_blank" rel="noopener">Visit &nearr;</a>` : ""}</div>
  </div>`,
};
// brand marks, the same ones the Killer Game's credits use
const ICON = {

  for (const s of quads) {
    const at = (a, b) => [0, 1, 2].map((k) => s.c[k] + s.r[k] * a * s.w / 2 + s.u[k] * b * s.h / 2);
    qv.push(...at(-1, -1), 0, 1, ...at(1, -1), 1, 1, ...at(1, 1), 1, 0, ...at(-1, 1), 0, 0);
    s.tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, s.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, s.canvas);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    delete s.canvas;
  }
  const qvao = gl.createVertexArray(); gl.bindVertexArray(qvao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(qv), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 20, 12);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  R = { world, quad, wvao, qvao, verts: v.length / 7, lightData: new Float32Array(64), lightCol: new Float32Array(48) };
}

// The camera never turns: it sits on the hall's centre line at half height and looks straight down it,
// so the only movement is forward or back. A modest field of view keeps the walls from rushing past.
let tanV = 1, tanH = 1, dist = 440;
const VW = () => document.documentElement.clientWidth;
function lens() {
  const aspect = VW() / innerHeight, wide = aspect >= 1;
  tanV = Math.tan((wide ? 56 : 70) * Math.PI / 360); tanH = tanV * aspect;
  // park where the gate opening fills most of the frame, whichever of width or height runs out first
  dist = Math.min(GAP - 110, Math.max((DW / 2) / (tanH * (wide ? 0.9 : 0.95)), (H / 2) / (tanV * 0.8)));
  // the gate's outline on screen when parked: every face is laid out at this size
  const w = (DW / 2) / (dist * tanH) * VW(), h = (H / 2) / (dist * tanV) * innerHeight, root = document.documentElement.style;
  root.setProperty("--l", ((VW() - w) / 2).toFixed(1) + "px"); root.setProperty("--t", ((innerHeight - h) / 2).toFixed(1) + "px");
  root.setProperty("--w", w.toFixed(1) + "px"); root.setProperty("--h", h.toFixed(1) + "px");
}
function viewProj(x) {
  const n = 4, far = 9000, P0 = 1 / tanH, P5 = 1 / tanV, A = (far + n) / (n - far), Bz = 2 * far * n / (n - far);
  // looking down +x: screen right is +z, up is +y. Columns of P * V written out.
  return new Float32Array([0, 0, -A, 1, 0, P5, 0, 0, P0, 0, 0, 0, 0, -P5 * EYE, A * x + Bz, -x]);
}
const gateGain = (k, q) => mix(0.6, 1, clamp(1 - Math.abs(q - k), 0, 1));
function render(x, q) {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(FOG[0], FOG[1], FOG[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const vp = viewProj(x), eye = [x, EYE, 0];
  const near = lights.filter((l) => Math.abs(l.p[0] - x) < 1700).sort((a, b) => Math.abs(a.p[0] - x) - Math.abs(b.p[0] - x)).slice(0, 16);
  near.forEach((l, i) => {
    const act = clamp(1 - Math.abs(q - l.key), 0, 1);
    R.lightData.set(l.p, i * 4); R.lightCol.set(l.col, i * 3);
    R.lightData[i * 4 + 3] = l.gate ? l.base * mix(0.25, 1, act) * (1 - lift(l.key, q)) : l.base * mix(0.55, 1.3, act); // a lifted gate stops glowing
  });
  gl.useProgram(R.world.p);
  gl.uniformMatrix4fv(R.world.u.uVP, false, vp);
  gl.uniform3fv(R.world.u.uEye, eye); gl.uniform3fv(R.world.u.uFog, FOG); gl.uniform2f(R.world.u.uRes, canvas.width, canvas.height);
  gl.uniform4fv(R.world.u.uLights, R.lightData); gl.uniform3fv(R.world.u.uLightCol, R.lightCol); gl.uniform1i(R.world.u.uNL, near.length);
  gl.bindVertexArray(R.wvao); gl.drawArrays(gl.TRIANGLES, 0, R.verts);

  gl.useProgram(R.quad.p);
  gl.uniformMatrix4fv(R.quad.u.uVP, false, vp);
  gl.uniform3fv(R.quad.u.uEye, eye); gl.uniform3fv(R.quad.u.uFog, FOG); gl.uniform1i(R.quad.u.uTex, 0);
  gl.bindVertexArray(R.qvao); gl.activeTexture(gl.TEXTURE0);
  gl.uniform1f(R.quad.u.uPark, dist); gl.uniform1f(R.quad.u.uK, GFOG);
  const gate = (s, i, gain) => { gl.uniform1f(R.quad.u.uLift, lift(s.gate, q) * (H + 8)); gl.uniform1f(R.quad.u.uGain, gain); gl.bindTexture(gl.TEXTURE_2D, s.tex); gl.drawArrays(gl.TRIANGLE_FAN, i * 4, 4); };
  // polished floor: the gate in front of you mirrored below it (and the next one, once this one is up)
  const k0 = Math.min(Math.floor(q), NS - 1), f = q - k0;
  gl.enable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.uniform1f(R.quad.u.uMirror, 1);
  quads.forEach((s, i) => {
    if (s.gate === undefined) return;
    const w = s.gate === k0 ? 1 : s.gate === k0 + 1 ? smooth(clamp((f - 0.3) / 0.3, 0, 1)) : 0;
    if (w > 0) gate(s, i, gateGain(s.gate, q) * w);
  });
  gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.uniform1f(R.quad.u.uMirror, 0);
  quads.forEach((s, i) => { if (s.gate !== undefined) gate(s, i, gateGain(s.gate, q)); });
  gl.enable(gl.BLEND); gl.depthMask(false); gl.uniform1f(R.quad.u.uLift, 0); gl.uniform1f(R.quad.u.uPark, 0); gl.uniform1f(R.quad.u.uK, FOGK);
  quads.forEach((s, i) => {
    if (!s.decal) return;
    gl.blendFunc(gl.ONE, s.add ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(R.quad.u.uGain, s.decal); gl.bindTexture(gl.TEXTURE_2D, s.tex);
    gl.drawArrays(gl.TRIANGLE_FAN, i * 4, 4);
  });
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.BLEND); gl.depthMask(true);
}

/* ---------- the rail: q is "which gate", fractional while travelling ---------- */
// Leaving gate k: first the gate rises (first 30% of the trip), then the camera glides to the next stop.
const lift = (k, q) => smooth(clamp((q - k) / 0.3, 0, 1));
function camX(q) {
  const k = Math.min(Math.floor(q), NS - 2), f = q - k;
  return mix(gx(k), gx(k + 1), smooth(clamp((f - 0.15) / 0.85, 0, 1))) - dist;
}
// A trip is a fixed-length glide with no acceleration at either end, so it starts and stops softly and
// never creeps. Jumps of more than one gate cut to the gate before and glide the last leg only.
const glide = (t) => t * t * t * (t * (t * 6 - 15) + 10);
let anchors = [];
const measure = () => { anchors = stops.map((s) => s.offsetTop); };
function nearest() { let best = 0; for (let k = 1; k < anchors.length; k++) if (Math.abs(anchors[k] - scrollY) < Math.abs(anchors[best] - scrollY)) best = k; return best; }

/* ---------- radar: the hall from above ---------- */
function buildRadar() {
  const X0 = -700, X1 = END + 80, svg = $("#r-svg");
  svg.setAttribute("viewBox", `${X0} -330 ${X1 - X0} 660`);
  const walls = `<rect x="${X0}" y="-192" width="${X1 - X0}" height="32" fill="currentColor" opacity=".42"/><rect x="${X0}" y="160" width="${X1 - X0}" height="32" fill="currentColor" opacity=".42"/>`;
  const gates = stops.map((_, k) => `<rect id="r-g${k}" x="${gx(k) - 14}" y="-160" width="28" height="320" fill="${THEME[themeOf(k)].a}"/>`).join("");
  const hits = stops.map((_, k) => `<rect class="hit" data-go="${k}" x="${gx(k) - GAP + 20}" y="-330" width="${GAP - 6}" height="660"><title>${esc(gateName(k))}</title></rect>`).join("");
  svg.innerHTML = `${walls}${gates}<g id="r-mk"><path d="M0 0 L380 -150 L380 150 Z" fill="#ece8df" opacity=".3"/><circle r="60" fill="#ece8df"/></g>${hits}`;
  svg.addEventListener("click", (e) => { const h = e.target.closest("[data-go]"); if (h) scrollTo(0, anchors[+h.dataset.go]); });
}

/* ---------- sound: off until asked for ---------- */
const Sound = (() => {
  let ctx, master, air, nb, on = false;
  const api = {};
  const SCALE = [0, 1, 3, 5, 7, 8, 10, 12, 13, 15]; // E Phrygian, one note per gate
  function start() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5;
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp).connect(ctx.destination);
    nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = (freq, type, qv) => { const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = nb; s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = qv; s.connect(f).connect(g).connect(master); s.start(); return g; };
    noise(220, "lowpass", 0.7).gain.value = 0.09;          // room tone
    air = noise(700, "bandpass", 0.5); air.gain.value = 0;   // rises with camera speed
    for (let k = 0; k < NS; k++) { // each gate hums its own note from where it stands (HRTF)
      const f = 82.41 * Math.pow(2, SCALE[k % SCALE.length] / 12);
      const pan = new PannerNode(ctx, { panningModel: "HRTF", distanceModel: "inverse", refDistance: 120, rolloffFactor: 2.4, positionX: gx(k), positionY: EYE, positionZ: 0 });
      const g = ctx.createGain(); g.gain.value = 0.22;
      for (const [mul, type, amp] of [[2, "triangle", 1], [4.01, "sine", 0.15], [1, "sine", 0.6]]) { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = type; o.frequency.value = f * mul; og.gain.value = amp; o.connect(og).connect(g); o.start(); }
      g.connect(pan).connect(master);
    }
  }
  api.toggle = () => {
    if (!ctx) start();
    on = !on; ctx.resume();
    master.gain.setTargetAtTime(on ? 0.6 : 0, ctx.currentTime, 0.08);
    $("#b-snd").innerHTML = `Sound <b>${on ? "on" : "off"}</b>`; $("#b-snd").setAttribute("aria-pressed", on);
  };
  api.frame = (x, speed) => {
    if (!ctx) return;
    const l = ctx.listener;
    if (l.positionX) { l.positionX.value = x; l.positionY.value = EYE; l.positionZ.value = 0; l.forwardX.value = 1; l.forwardY.value = 0; l.forwardZ.value = 0; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; }
    else { l.setPosition(x, EYE, 0); l.setOrientation(1, 0, 0, 0, 1, 0); }
    air.gain.setTargetAtTime(clamp(speed / 700, 0, 1) * 0.14, ctx.currentTime, 0.1);
  };
  api.gate = () => { // a gate motor: a rising band of noise, then the stop
    if (!ctx || !on) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = nb; f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(520, t + 0.7);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.08); g.gain.setValueAtTime(0.3, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.78);
    s.connect(f).connect(g).connect(master); s.start(t, 0, 0.85);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.setValueAtTime(90, t + 0.72); o.frequency.exponentialRampToValueAtTime(45, t + 0.86);
    og.gain.setValueAtTime(0.0001, t); og.gain.setValueAtTime(0.4, t + 0.72); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(og).connect(master); o.start(t + 0.7); o.stop(t + 0.95);
  };
  api.pause = (hidden) => { if (ctx) hidden ? ctx.suspend() : (on && ctx.resume()); };
  return api;
})();

/* ---------- main loop ---------- */
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(VW() * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
function motionLabel() { $("#b-mot").innerHTML = `Motion <b>${calm ? "calm" : "full"}</b>`; }

function boot() {
  buildQuads(); buildRadar(); lens(); measure(); resize();
  initGL();
  let target = nearest(), q = target, from = q, t0 = 0, dur = 1, shown = -1, n = 0, drawn = "";

  const loop = (now) => {
    requestAnimationFrame(loop);
    const want = nearest();
    if (want !== target) {
      target = want;
      if (Math.abs(target - q) > 1.5) q = target - Math.sign(target - q);
      from = q; t0 = now; dur = 900 + 1200 * Math.min(1, Math.abs(target - q));
      Sound.gate();
    }
    const before = camX(q);
    q = calm ? target : mix(from, target, glide(clamp((now - t0) / dur, 0, 1)));
    const x = camX(q);

    resize();
    const sig = `${x.toFixed(2)},${q.toFixed(4)},${q === target},${canvas.width},${canvas.height}`;
    if (sig !== drawn) {   // parked, nothing changes: no work at all
      drawn = sig; render(x, q);
      // Every gate in view wears its section: same size, same lift, same fade as the slab behind it.
      const parked = q === target ? target : -1, Hh = innerHeight;
      faces.forEach((fc, k) => {
        const d = gx(k) - x, up = lift(k, q) * (H + 8);
        const vis = d > 8 && k >= Math.floor(q) && k <= Math.ceil(q) && (up - H / 2) / (d * tanV) < 1;
        if (vis !== fc.classList.contains("vis")) fc.classList.toggle("vis", vis);
        if (!vis) return;
        fc.style.transform = k === parked ? "none" : `translate3d(0, ${(-up / (d * tanV) * Hh / 2).toFixed(2)}px, 0) scale(${(dist / d).toFixed(5)})`;
        fc.style.setProperty("--fog", (1 - gateGain(k, q) * Math.exp(-Math.max(0, d - dist) * GFOG)).toFixed(3));
        fc.inert = k !== parked; // only the gate you are parked at can be clicked or tabbed into
      });
      shown = parked;
    }
    Sound.frame(x, Math.abs(x - before) * 60);

    if (++n % 3 === 0) {
      $("#r-mk").setAttribute("transform", `translate(${x.toFixed(0)} 0)`);
      $("#r-where").textContent = gateName(target);
      $("#r-n").textContent = `${pad(target)} / ${pad(NS - 1)}`;
      for (let k = 0; k < NS; k++) $("#r-g" + k).setAttribute("opacity", lift(k, q) > 0.5 ? 0.2 : 1);
    }
  };
  requestAnimationFrame(loop);
  addEventListener("resize", () => { resize(); lens(); measure(); drawn = ""; });
  window.__rf = { anchors: () => anchors, state: () => ({ q, target, shown }) };
}

$("#b-snd").addEventListener("click", () => Sound.toggle());
$("#b-mot").addEventListener("click", () => { calm = !calm; store.set("rf-motion", calm ? "calm" : "full"); motionLabel(); });
document.addEventListener("visibilitychange", () => Sound.pause(document.hidden));
motionLabel();

if (gl) {
  document.fonts.load('700 100px "Barlow Condensed"').catch(() => {}).then(boot); // the floor numbers are drawn with it
} else document.body.classList.add("no3d"); // no WebGL2: the page is still the whole site, on a plain background
})();
</script>
</body>
</html>
